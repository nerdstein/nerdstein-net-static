<div class="post-meta">
  {{ if not .Date.IsZero }}<span class="post-meta-date">{{ .Date.Format "January 2, 2006" }}</span>
  <span class="post-meta-sep">·</span>{{ end }}
  <span class="post-meta-read">{{ .ReadingTime }} min read</span>
  {{ range .Params.tags }}
  <span class="post-meta-sep">·</span>
  <a href="/tags/{{ . | urlize }}/" class="post-meta-tag">#{{ . }}</a>
  {{ end }}
</div>
