{{ define "main" }}
<div class="archive">
  <header class="archive-header">
    <h1 class="archive-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="archive-intro">{{ . }}</div>{{ end }}
  </header>

  {{ range (.Pages.ByDate.Reverse).GroupByDate "2006" }}
  <section class="archive-year">
    <h2 class="archive-year-label">{{ .Key }}</h2>
    <ul class="archive-list">
      {{ range .Pages }}
      <li class="archive-item">
        <span class="archive-item-date">{{ .Date.Format "Jan 02" }}</span>
        <a href="{{ .RelPermalink }}" class="archive-item-title">{{ .Title }}</a>
        <span class="archive-item-tags">{{ range .Params.tags }}<span class="tag">#{{ . }}</span> {{ end }}</span>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}

</div>
{{ end }}
