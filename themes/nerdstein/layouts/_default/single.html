{{ define "main" }}
<article class="post">
  <header class="post-header">
    <a href="/blog/" class="back-link">&larr; Writing</a>
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "post-meta.html" . }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <nav class="post-nav">
    {{ with .PrevInSection }}<a href="{{ .RelPermalink }}" class="post-nav-prev">&larr; {{ .Title }}</a>{{ end }}
    {{ with .NextInSection }}<a href="{{ .RelPermalink }}" class="post-nav-next">{{ .Title }} &rarr;</a>{{ end }}
  </nav>
</article>
{{ end }}
