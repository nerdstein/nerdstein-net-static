<svg viewBox="0 0 300 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hand-drawn growth chart after Larry Greiner: an organization climbs through calm stretches of steady growth, each one ending in a short, jagged crisis before the next stretch begins">
