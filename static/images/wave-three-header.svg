  <line x1="800" y1="270" x2="800" y2="448" stroke="#2a2823" stroke-width="1" stroke-dasharray="3 7" opacity="0.18"/>

  <!-- Zone labels -->
  <text x="207" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a7560" font-style="italic">Wave 1 — Exploration</text>
  <text x="600" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a7560" font-style="italic">Wave 2 — Adoption</text>
  <text x="995" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c8531a" font-style="italic" font-weight="bold">Wave 3 — Maturity</text>

</svg>
