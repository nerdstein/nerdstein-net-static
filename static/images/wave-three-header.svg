  <line x1="663" y1="297" x2="659" y2="287" stroke="#2a2823" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="670" y1="298" x2="676" y2="289" stroke="#2a2823" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

