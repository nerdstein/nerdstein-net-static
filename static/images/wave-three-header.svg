  <line x1="988" y1="174" x2="996" y2="188" stroke="#c8531a" stroke-width="2" stroke-linecap="round"/>
  <!-- Board -->
  <path d="M 976,189 C 978,193 998,193 1000,189 C 998,185 978,185 976,189 Z" fill="#c8531a" opacity="0.75"/>

  <!-- Water depth lines zone 3 -->
  <path d="M 820,405 C 880,400 950,408 1020,403 C 1090,398 1145,406 1173,402" fill="none" stroke="#2a2823" stroke-width="0.7" stroke-linecap="round" opacity="0.22"/>
  <path d="M 820,422 C 880,418 950,425 1020,420 C 1090,415 1145,422 1173,419" fill="none" stroke="#2a2823" stroke-width="0.7" stroke-linecap="round" opacity="0.15"/>
