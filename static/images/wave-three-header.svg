  <line x1="1015" y1="153" x2="1024" y2="142" stroke="#c8531a" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <line x1="1005" y1="155" x2="996" y2="144" stroke="#c8531a" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <line x1="1021" y1="157" x2="1032" y2="148" stroke="#c8531a" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <circle cx="1000" cy="135" r="2" fill="#c8531a" opacity="0.5"/>
