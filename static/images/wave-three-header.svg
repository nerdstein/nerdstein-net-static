  <path d="M 935,72 Q 948,61 961,72" fill="none" stroke="#2a2823" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1080,108 Q 1092,99 1104,108" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 1130,82 Q 1140,74 1150,82" fill="none" stroke="#2a2823" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Big wave water body -->
  <path d="M 815,385
    C 845,385 868,365 898,338
    C 926,312 948,270 965,232
    C 976,208 986,186 995,170
    C 1001,160 1010,155 1020,160
    C 1030,165 1032,182 1025,210
    C 1016,242 998,268 1018,300
    C 1040,334 1085,356 1125,370
