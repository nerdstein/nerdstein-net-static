  <path d="M 30,352
    C 42,352 43,328 56,327
    C 69,326 70,353 83,354
    C 96,355 97,327 110,325
    C 123,323 125,354 138,356
    C 151,358 152,324 166,322
    C 180,320 181,355 194,357
    C 207,359 208,326 222,324
    C 236,322 237,356 250,357
    C 263,358 264,324 278,322
    C 292,320 293,354 306,355
