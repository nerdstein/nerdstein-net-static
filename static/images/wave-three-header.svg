  <line x1="58" y1="322" x2="65" y2="312" stroke="#2a2823" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <line x1="162" y1="316" x2="157" y2="305" stroke="#2a2823" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="168" y1="317" x2="175" y2="307" stroke="#2a2823" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="274" y1="316" x2="269" y2="306" stroke="#2a2823" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
