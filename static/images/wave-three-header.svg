  <rect x="472" y="200" width="52" height="14" rx="2" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="476" y="210" width="52" height="14" rx="2" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <rect x="480" y="220" width="52" height="14" rx="2" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  <!-- Stack B -->
  <rect x="638" y="185" width="52" height="14" rx="2" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="642" y="195" width="52" height="14" rx="2" fill="none" stroke="#2a2823" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
